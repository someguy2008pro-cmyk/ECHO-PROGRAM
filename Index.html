
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08111e">
  <title>PROJECT ECHO 0.3</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app">
    <header class="header">
      <div class="logo">E</div>
      <div>
        <h2>PROJECT ECHO</h2>
        <small>PROTOTYPE 0.3</small>
      </div>
      <span class="status">● LOCAL</span>
    </header>

    <main>
      <section class="intro">
        <div class="orb">E</div>
        <h1>A space to think.<br>
          <span>A system to evolve.</span>
        </h1>
        <p>
          Chào mừng đến với Project ECHO.
          Một hệ thống đang trong quá trình hình thành.
        </p>
      </section>

      <section class="chat" id="messages">
        <div class="message echo">
          <b>ECHO</b>
          <p>Xin chào. Tôi là ECHO 0.3. Hiện tại tôi đang ở chế độ thử nghiệm giao diện.</p>
        </div>
      </section>

      <form id="chatForm">
        <textarea id="messageInput"
          placeholder="Nhập tin nhắn..."
          rows="2"></textarea>
        <button type="submit">↑</button>
      </form>

      <p class="disclaimer">
        ECHO 0.3 · Phản hồi mô phỏng · Chưa kết nối AI
      </p>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
